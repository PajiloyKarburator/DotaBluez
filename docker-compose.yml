version: "3.9"

services:
  db:
    image: postgres:16
    container_name: dotabluez_db
    restart: always
    environment:
      POSTGRES_DB: dotabluez
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5445:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: