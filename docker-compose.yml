version: "3.9"

services:
  db:
    image: postgres:16
    container_name: dotabluez_db
    restart: always
    environment:
      POSTGRES_DB: dotabluez
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5445:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dotabluez"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    build: .
    container_name: dotabluez_migrations
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  bot:
    build: .
    container_name: dotabluez_bot
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    env_file:
      - .env.docker
    command: ["python", "bot.py"]
    restart: always

volumes:
  postgres_data: